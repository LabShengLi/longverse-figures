# Binder builds from this file. R is here because four of the paper's panels are drawn with
# it - the DMR ideograms with ggbio, the imprinting heatmaps with ComplexHeatmap, the
# haplotype boxplot with ggpubr and the region hexbins with ggplot2 - and this repository
# runs the paper's own code rather than a lookalike. Every R package below is a prebuilt
# conda binary, not a source build, so the image takes about ten minutes to build once and
# is cached from then on.
name: longverse-figures
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - matplotlib=3.8
  - pandas=2.2
  - numpy=1.26
  - scipy=1.13
  - matplotlib-venn
  - jupyterlab=4.2
  - ipython<9
  # R, for the four panels whose authoritative implementation is in R
  - r-base=4.4.3
  - r-ggplot2
  - r-ggpubr
  - r-patchwork
  - r-dplyr
  - r-readr
  - rpy2
  # rpy2 lets the four R panels be R cells in the same notebook as the Python ones, rather
  # than R source held in a Python string and written to a file to run.
  - r-circlize
  - r-rcolorbrewer
  - r-tidyverse
  - bioconductor-ggbio
  - bioconductor-complexheatmap
  - bioconductor-genomicranges
  - bioconductor-rtracklayer
  - r-argparser
  # NanoMethViz draws the GNAS region plots, and the paper used 3.2.0. R is pinned to 4.4
  # for it: Bioconductor 3.18, which is what R 4.3 gets, ships 2.8.1, and 2.8.1's
  # plot_grange() has none of smoothing_window, heatmap_subsample or gene_anno. The
  # difference is an API, not a style, so the paper's script cannot run against it at all.
  # 3.x arrives with Bioconductor 3.19, which needs R 4.4. The pin is 4.4.3, the version
  # the paper's figures were drawn on, so the R here and the R there are the same.
  #
  # Its compiled dependencies come from bioconda prebuilt, because the source route failed
  # in the Binder image on Cairo and rhdf5filters and left the panel undrawn.
  - bioconductor-rhdf5
  - bioconductor-rhdf5filters
  - bioconductor-bsseq
  - r-ggrastr
  - bioconductor-genomeinfodbdata
  - bioconductor-biocsingular
  - r-irlba
  - r-dbscan
  # No conda compiler here on purpose. bioconda's newest NanoMethViz is 2.8.1, so 3.2.0
  # is compiled in postBuild, and conda-forge's cxx-compiler was tried for that and could
  # not reach its own cc1plus. postBuild uses the base image's g++ instead.
